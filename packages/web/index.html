<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blossom Carousel Web Component</title>
    <link rel="stylesheet" href="./dev.css" />
  </head>
  <body>
    <div class="page">
      <h1>Blossom in Web Component</h1>
      <blossom-carousel id="my-carousel" class="carousel">
        <div class="slide" data-blossom-slide>1</div>
        <div class="slide" data-blossom-slide>2</div>
        <div class="slide" data-blossom-slide>3</div>
        <div class="slide" data-blossom-slide>4</div>
        <div class="slide" data-blossom-slide>5</div>
        <div class="slide" data-blossom-slide>6</div>
        <div class="slide" data-blossom-slide>7</div>
        <div class="slide" data-blossom-slide>8</div>
        <div class="slide" data-blossom-slide>9</div>
        <div class="slide" data-blossom-slide>10</div>
        <div class="slide" data-blossom-slide>11</div>
        <div class="slide" data-blossom-slide>12</div>
      </blossom-carousel>
      <div class="controls">
        <blossom-prev for="my-carousel"></blossom-prev>
        <blossom-dots for="my-carousel"></blossom-dots>
        <blossom-next for="my-carousel"></blossom-next>
      </div>
    </div>
    <script type="module" src="src/index.ts"></script>
  </body>
</html>
